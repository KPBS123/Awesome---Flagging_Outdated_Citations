project:
  name: "Awesome---Flagging_Outdated_Citations"
  random_seed: 42
  eval_year: 2026

apis:
  openalex_base_url: "https://api.openalex.org/works"
  polite_email: "researcher@example.edu"
  request_timeout_sec: 15
  top_k_candidates: 6

models:
  scibert_encoder: "allenai/scibert_scivocab_uncased"
  nli_cross_encoder: "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
  scicite_dataset: "allenai/scicite"

thresholds:
  age_baseline_years: 5
  similarity_baseline_min: 0.75
  decision_threshold: 0.50
